services:
  db:
    image: postgres:16-alpine
    container_name: devops-survival-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devops_survival}
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops} -d ${POSTGRES_DB:-devops_survival}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: devops-survival-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-devops_survival}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-700}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  devops-survival:
    build: .
    container_name: devops-survival
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  uploads_data:
