name: DND Adventure CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -p 'test_*.py'
      - run: python -m compileall backend/app
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Test OpenRouter API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: openrouter/free
        run: |
          set -e
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is EMPTY"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = os.environ['OPENAI_BASE_URL'].rstrip('/') + '/chat/completions'
          payload = json.dumps({
              'model': os.environ['OPENAI_MODEL'],
              'messages': [{'role': 'user', 'content': 'Reply with exactly OK'}],
              'max_tokens': 16,
          }).encode('utf-8')
          request = urllib.request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + os.environ['OPENAI_API_KEY'],
                  'Content-Type': 'application/json',
                  'HTTP-Referer': 'https://atlas-infra.ru',
                  'X-Title': 'DND Adventure',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode('utf-8')
                  print('OpenRouter HTTP status:', response.status)
                  print('OpenRouter API test: OK')
                  print('Response preview:', body[:200])
          except urllib.error.HTTPError as exc:
              print('OpenRouter HTTP status:', exc.code)
              print('OpenRouter response:')
              print(exc.read().decode('utf-8')[:1000])
              raise SystemExit(1)
          PY
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: openrouter/free
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OPENAI_API_KEY,OPENAI_BASE_URL,OPENAI_MODEL
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            export OPENAI_API_KEY="$OPENAI_API_KEY"
            export OPENAI_BASE_URL="$OPENAI_BASE_URL"
            export OPENAI_MODEL="$OPENAI_MODEL"
            git pull --ff-only origin main
            docker compose up -d --build
            docker compose ps
            for i in {1..30}; do
              if curl -fsS http://localhost:8088/api/health; then
                echo "Application is healthy"
                break
              fi
              echo "Waiting for application... attempt $i/30"
              sleep 2
            done
            if ! curl -fsS http://localhost:8088/api/health; then
              echo "Application failed healthcheck"
              docker compose logs --tail=100
              exit 1
            fi
            echo "AI DM configuration:"
            echo "OPENAI_BASE_URL=$OPENAI_BASE_URL"
            echo "OPENAI_MODEL=$OPENAI_MODEL"
            if [ -n "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY=SET"; else echo "OPENAI_API_KEY=EMPTY"; exit 1; fi
            echo
