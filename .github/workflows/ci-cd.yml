name: DND Adventure CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -p 'test_*.py'
      - run: python -m compileall backend/app
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OPENAI_API_KEY,OPENAI_MODEL
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            export OPENAI_API_KEY="$OPENAI_API_KEY"
            export OPENAI_MODEL="$OPENAI_MODEL"
            git pull --ff-only origin main
            docker compose up -d --build
            docker compose ps
            for i in {1..30}; do
              if curl -fsS http://localhost:8088/api/health; then
                echo "Application is healthy"
                break
              fi
              echo "Waiting for application... attempt $i/30"
              sleep 2
            done
            if ! curl -fsS http://localhost:8088/api/health; then
              echo "Application failed healthcheck"
              docker compose logs --tail=100
              exit 1
            fi
            echo "AI DM configuration:"
            curl -fsS -H "Authorization: Bearer $OPENAI_API_KEY" http://localhost:8088/api/dm/status || true
            echo
